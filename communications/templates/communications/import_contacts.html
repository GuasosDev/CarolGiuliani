{% load static %}
<div class="comm-apple-modal comm-import-contacts-modal">
<div class="modal-header">
    <div class="comm-apple-heading">
        <p class="comm-apple-kicker">Contactos</p>
        <h3 class="modal-title">Importar contactos</h3>
    </div>
    <button type="button" class="btn-close" onclick="closeModal()" aria-label="Close"></button>
</div>

<div class="modal-body">
    <div id="uploadStep">
        <section class="comm-apple-section">
            <div class="comm-import-dropzone" id="dropZone">
                <i class="fas fa-cloud-upload-alt"></i>
                <h5>Arrastrá tu archivo CSV</h5>
                <p>O hacé clic para seleccionarlo desde tu computadora</p>
                <input type="file" id="csv_file_input" class="d-none" accept=".csv">
            </div>
            <div class="comm-import-hint">
                El sistema detecta automáticamente el separador y si hay encabezados (Nombre, Email, Teléfono, Empresa).
            </div>
        </section>
    </div>

    <div id="previewStep" class="d-none">
        <section class="comm-apple-section mb-2">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h4 class="comm-apple-section-title mb-0">Vista previa</h4>
                <span class="comm-import-badge" id="rowCountBadge">0 filas</span>
            </div>
            <div class="comm-import-table-wrap table-responsive">
                <table class="table table-hover table-sm mb-0" id="previewTable">
                    <thead>
                        <tr id="tableHeader"></tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </section>

        <form method="post" action="{% url 'communications:import_contacts_csv' %}" enctype="multipart/form-data" id="finalForm">
            {% csrf_token %}
            <input type="file" name="csv_file" id="actual_file" class="d-none">
            <div class="d-flex gap-2 justify-content-end">
                <button type="button" class="btn btn-sm comm-apple-btn-ghost" onclick="resetUpload()">Cambiar</button>
                <button type="submit" class="btn btn-sm comm-apple-btn-primary">Importar ahora</button>
            </div>
        </form>
    </div>
</div>
</div>

<script src="{% static 'communications/js/import_contacts.js' %}"></script>
