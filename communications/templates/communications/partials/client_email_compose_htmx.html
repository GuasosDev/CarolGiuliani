{% load comm_mail static %}
<div class="modal-header border-bottom">
    <h5 class="modal-title" id="clientEmailComposeTitle">
        <i class="fas fa-envelope me-2 text-primary" aria-hidden="true"></i>{% if client %}Correo a {{ client.name }}{% else %}Redactar correo{% endif %}
    </h5>
    <button type="button" class="btn-close" onclick="try { sessionStorage.removeItem('clientListScrollY'); } catch (e) {} closeModal()" aria-label="Cerrar ventana de redacción de correo"></button>
</div>
<div class="modal-body">
    {% if email_account %}
    <form method="post" action="/communications/api/email-accounts/{{ email_account.id }}/send_email/"
        id="emailForm" enctype="multipart/form-data"
        data-reply-to="{% if client %}{{ client.email|default:'' }}{% endif %}"
        data-reply-subject="{% if conversation %}{{ conversation.subject|default:''|decode_email_subject }}{% endif %}"
        data-reply-cc="{{ reply_cc_joined|default:'' }}"
        data-conversation-id="{% if conversation %}{{ conversation.id }}{% endif %}"
        data-return-url="{{ return_url }}"
        data-contacts-endpoint="{% url 'communications:contacts_email_search' %}">
        {% csrf_token %}
        <input type="file" id="imageInputEmail" name="attachments" multiple hidden>
        <input type="hidden" name="conversation_id" id="emailConversationIdInput" value="{% if conversation %}{{ conversation.id }}{% endif %}">

        <div class="bg-white p-2 rounded border mb-2">
            <div id="emailFilePreview" class="mb-2" aria-live="polite"></div>
            <label class="form-label small text-muted mb-0" for="emailToInput">Para</label>
            <div class="position-relative mb-2">
                <input type="text" name="to_addresses" id="emailToInput"
                    class="form-control form-control-sm"
                    placeholder="Buscar contacto o grupo; varios correos por coma"
                    value="{% if client %}{{ client.email|default:'' }}{% endif %}"
                    autocomplete="off"
                    spellcheck="false"
                    required
                    title="Direcciones de correo del destinatario. Podés buscar en la agenda al escribir."
                    aria-label="Destinatarios en campo Para: escribí correos separados por coma o elegí sugerencias al escribir.">
                <div id="emailToSuggest" class="comm-email-suggest"></div>
            </div>
            <label class="form-label small text-muted mb-0" for="emailCcInput">Cc</label>
            <div class="position-relative mb-2">
                <input type="text" name="cc_addresses" id="emailCcInput"
                    class="form-control form-control-sm"
                    placeholder="Con copia (opcional)"
                    value=""
                    autocomplete="off"
                    spellcheck="false"
                    title="Destinatarios en copia visibles, separados por coma."
                    aria-label="Campo copia (Cc): correos separados por coma.">
                <div id="emailCcSuggest" class="comm-email-suggest"></div>
            </div>
            <label class="form-label small text-muted mb-0" for="emailBccInput">Cco</label>
            <div class="position-relative mb-2">
                <input type="text" name="bcc_addresses" id="emailBccInput"
                    class="form-control form-control-sm"
                    placeholder="Copia oculta (opcional)"
                    value=""
                    autocomplete="off"
                    spellcheck="false"
                    title="Destinatarios en copia oculta, separados por coma."
                    aria-label="Campo copia oculta (Cco): correos separados por coma.">
                <div id="emailBccSuggest" class="comm-email-suggest"></div>
            </div>
            <label class="form-label small text-muted mb-0" for="emailSubjectInput">Asunto</label>
            <div class="mb-2">
                <input type="text" name="subject" id="emailSubjectInput"
                    class="form-control form-control-sm fw-bold"
                    placeholder="Asunto"
                    value=""
                    required
                    title="Asunto del mensaje que verá el destinatario."
                    aria-label="Asunto del correo.">
            </div>
            <div class="form-label small text-muted mb-0">Mensaje</div>
            <div class="d-flex align-items-start">
                <div class="form-control border-0 shadow-none px-0"
                    contenteditable="true"
                    id="emailBodyDiv"
                    style="min-height: 120px; max-height: 320px; overflow-y: auto;"
                    role="textbox"
                    aria-multiline="true"
                    aria-label="Cuerpo del mensaje de correo."
                    title="Escribí el cuerpo del correo. Podés adjuntar archivos con el botón de abajo."
                    placeholder="Escribe el contenido del correo..."
                    data-placeholder="Escribe el contenido del correo..."></div>
                <input type="hidden" name="body" id="emailBodyInput">
            </div>
            <div class="mt-2 d-flex gap-2 flex-wrap align-items-center">
                <button type="button" class="btn btn-sm btn-outline-secondary"
                    onclick="document.getElementById('imageInputEmail').click()"
                    title="Adjuntar uno o más archivos al correo"
                    aria-label="Adjuntar archivos al correo">
                    <i class="fas fa-paperclip me-1" aria-hidden="true"></i>Adjuntar
                </button>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="try { sessionStorage.removeItem('clientListScrollY'); } catch (e) {} closeModal()"
                title="Cerrar sin enviar y volver al listado de contactos"
                aria-label="Cancelar: cerrar sin enviar el correo">
                Cancelar
            </button>
            <button type="submit" class="btn btn-primary btn-sm px-4"
                title="Enviar el correo y volver al listado de contactos"
                aria-label="Enviar correo y volver al listado de contactos">
                <i class="fas fa-paper-plane me-2" aria-hidden="true"></i>Enviar
            </button>
        </div>
    </form>
    <script src="{% static 'communications/js/client_email_compose.js' %}"></script>
    {% else %}
    <div class="alert alert-warning mb-0 text-center rounded-3 p-2 small" role="alert">
        <i class="fas fa-envelope me-2" aria-hidden="true"></i>Configura una cuenta de Email activa para enviar desde aquí.
    </div>
    {% endif %}
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-secondary" onclick="try { sessionStorage.removeItem('clientListScrollY'); } catch (e) {} closeModal()"
        title="Cerrar esta ventana sin enviar"
        aria-label="Cerrar ventana de redacción">
        Cerrar
    </button>
</div>
