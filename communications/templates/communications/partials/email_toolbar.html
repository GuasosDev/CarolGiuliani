<div class="comm-gm-frame">
    <div class="comm-gm-topbar">
        <div class="comm-gm-dots" aria-hidden="true">
            <span class="comm-gm-dot r"></span>
            <span class="comm-gm-dot y"></span>
            <span class="comm-gm-dot g"></span>
        </div>
        <form method="get" action="{% url 'communications:dashboard' %}" class="comm-gm-search" role="search">
            <input type="hidden" name="channel" value="email">
            {% if current_folder %}<input type="hidden" name="folder" value="{{ current_folder }}">{% endif %}
            {% if current_status %}<input type="hidden" name="status" value="{{ current_status }}">{% endif %}
            <i class="fas fa-search" aria-hidden="true"></i>
            <input type="search" name="q" value="{{ search_q|default:'' }}" placeholder="Buscar correos, contactos...">
            <select name="search_scope" title="Restringir búsqueda a carpeta" aria-label="Ámbito de búsqueda">
                <option value="all"{% if search_scope == "all" or not search_scope %} selected{% endif %}>Todos</option>
                <option value="inbox"{% if search_scope == "inbox" %} selected{% endif %}>Recibidos</option>
                <option value="sent"{% if search_scope == "sent" %} selected{% endif %}>Enviados</option>
                <option value="drafts"{% if search_scope == "drafts" %} selected{% endif %}>Borradores</option>
                <option value="trash"{% if search_scope == "trash" %} selected{% endif %}>Papelera</option>
            </select>
        </form>
        <div class="comm-gm-account" title="Cuenta de correo activa">
            <i class="fas fa-user-circle" aria-hidden="true"></i>
            <span>{% if email_account %}{{ email_account.email_address }}{% else %}Correo{% endif %}</span>
        </div>
    </div>
    <div class="comm-gm-actions">
        <button type="button" class="comm-gm-btn-new" onclick="commMailCompose('new')">
            <i class="fas fa-pen" aria-hidden="true"></i>
            <span>Correo nuevo</span>
        </button>
        <button type="button" class="comm-gm-btn" title="Eliminar (mover a papelera)" onclick="commMailMoveToTrash()">
            <i class="fas fa-trash-alt" aria-hidden="true"></i>
            <span>Eliminar</span>
        </button>
        <button type="button" class="comm-gm-btn" title="Responder" onclick="commMailCompose('reply')">
            <i class="fas fa-reply" aria-hidden="true"></i>
            <span>Responder</span>
        </button>
        <button type="button" class="comm-gm-btn" title="Responder a todos" onclick="commMailCompose('reply-all')">
            <i class="fas fa-reply-all" aria-hidden="true"></i>
            <span>Responder a todos</span>
        </button>
        <button type="button" class="comm-gm-btn" title="Reenviar" onclick="commMailCompose('forward')">
            <i class="fas fa-share" aria-hidden="true"></i>
            <span>Reenviar</span>
        </button>
        <div class="dropdown d-flex align-items-center">
            <button type="button" class="comm-gm-btn dropdown-toggle" title="Marcar mensajes" data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false">
                <i class="fas fa-flag" aria-hidden="true"></i>
                <span>Marcar</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end py-1">
                <li><button type="button" class="dropdown-item" onclick="commMailMarkUnread()">Como no leído</button></li>
                <li><button type="button" class="dropdown-item" onclick="commMailMarkRead()">Como leído</button></li>
            </ul>
        </div>
        <button type="button" class="comm-gm-btn" title="Marcar como leído" onclick="commMailMarkRead()">
            <i class="fas fa-envelope-open" aria-hidden="true"></i>
            <span>Marcar como leído</span>
        </button>
    </div>
</div>
