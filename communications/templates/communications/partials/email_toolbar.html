<div class="comm-mail-toolbar flex-grow-1">
    <div class="dropdown comm-mail-folder-wrap d-flex align-items-center">
        <button class="btn comm-mail-folder-trigger dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false">
            <span class="comm-mail-ico-box"><i class="fas fa-inbox" aria-hidden="true"></i></span>
            <span>
{% if current_folder == 'sent' %}
    Enviados
{% elif current_folder == 'drafts' %}
    Borradores
{% elif current_folder == 'trash' %}
    Papelera
{% else %}
    Entrada
{% endif %}
</span>
        </button>
        <ul class="dropdown-menu comm-mail-folder-menu py-1">
            <li>
                <a class="dropdown-item {% if current_folder == 'inbox' or not current_folder %}active{% endif %}" 
href="{% url 'communications:dashboard' %}?channel=email&folder=inbox">
                    <span class="comm-mail-folder-row">
                        <span class="comm-mail-folder-ico" aria-hidden="true"><i class="fas fa-inbox"></i></span>
                        <span>Entrada</span>
                    </span>
                    <span class="comm-mail-folder-badge">{{ current_filter_total }}</span>
                </a>
            </li>
            <li>
                <a class="dropdown-item {% if current_status == 'pending' %}active{% endif %}" href="{% url 'communications:dashboard' %}?channel=email&status=pending">
                    <span class="comm-mail-folder-row">
                        <span class="comm-mail-folder-ico" aria-hidden="true"><i class="fas fa-file-alt"></i></span>
                        <span>Borradores</span>
                    </span>
                    <span class="comm-mail-folder-badge">0</span>
                </a>
            </li>
            <li>
            <a class="dropdown-item {% if current_folder == 'sent' %}active{% endif %}" 
href="{% url 'communications:dashboard' %}?channel=email&folder=sent">

                <span class="comm-mail-folder-row">
                    <span class="comm-mail-folder-ico">
                        <i class="fas fa-paper-plane"></i>
                    </span>
                    <span>Enviados</span>
                </span>

                <span class="comm-mail-folder-badge">
                    {{ sent_count }}
                </span>
            </a>
</li>
            <li><hr class="dropdown-divider my-1 opacity-50"></li>
            <li>
                <span class="dropdown-item disabled d-flex align-items-center justify-content-between gap-2">
                    <span class="comm-mail-folder-row">
                        <span class="comm-mail-folder-ico" aria-hidden="true"><i class="fas fa-shield-alt"></i></span>
                        <span>SPAM</span>
                    </span>
                    <span class="comm-mail-folder-badge">0</span>
                </span>
            </li>
            <li>
                <a class="dropdown-item {% if current_status == 'closed' %}active{% endif %}" href="{% url 'communications:dashboard' %}?channel=email&status=closed">
                    <span class="comm-mail-folder-row">
                        <span class="comm-mail-folder-ico" aria-hidden="true"><i class="fas fa-trash-alt"></i></span>
                        <span>Papelera</span>
                    </span>
                    <span class="comm-mail-folder-badge">{{ closed_count }}</span>
                </a>
            </li>
        </ul>
    </div>
    <span class="comm-mail-toolbar-sep" aria-hidden="true"></span>
    <button type="button" class="btn btn-toolbar-mail" title="Actualizar lista" onclick="commMailRefreshList()">
        <span class="comm-mail-tb-ico"><i class="fas fa-sync-alt"></i></span><span>Actualizar</span>
    </button>
    <button type="button" class="btn btn-toolbar-mail" title="Redactar" onclick="commMailCompose('new')">
        <span class="comm-mail-tb-ico"><i class="fas fa-pen"></i></span><span>Redactar</span>
    </button>
    <button type="button" class="btn btn-toolbar-mail" title="Responder" onclick="commMailCompose('reply')">
        <span class="comm-mail-tb-ico"><i class="fas fa-reply"></i></span><span>Responder</span>
    </button>
    <button type="button" class="btn btn-toolbar-mail" title="Responder a todos" onclick="commMailCompose('reply-all')">
        <span class="comm-mail-tb-ico"><i class="fas fa-reply-all"></i></span><span>Responder a todos</span>
    </button>
    <button type="button" class="btn btn-toolbar-mail" title="Reenviar" onclick="commMailCompose('forward')">
        <span class="comm-mail-tb-ico"><i class="fas fa-share"></i></span><span>Reenviar</span>
    </button>
    <button type="button" class="btn btn-toolbar-mail" title="Mover a papelera" onclick="commMailMoveToTrash()">
        <span class="comm-mail-tb-ico"><i class="fas fa-trash-alt"></i></span><span>Eliminar</span>
    </button>
    <div class="dropdown d-flex align-items-center">
        <button type="button" class="btn btn-toolbar-mail dropdown-toggle" title="Marcar mensajes" data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false">
            <span class="comm-mail-tb-ico"><i class="fas fa-flag"></i></span><span>Marcar</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end comm-mail-toolbar-menu py-1">
            <li><button type="button" class="dropdown-item" onclick="commMailMarkUnread()">Como no leído</button></li>
            <li><button type="button" class="dropdown-item" onclick="commMailMarkRead()">Como leído</button></li>
        </ul>
    </div>
    <div class="dropdown d-flex align-items-center">
        <button class="btn btn-toolbar-mail dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-display="static" aria-expanded="false">
            <span class="comm-mail-tb-ico"><i class="fas fa-ellipsis-h"></i></span><span>Más</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end comm-mail-toolbar-menu py-1">
            <li><span class="dropdown-item text-muted small py-2">Acciones adicionales próximamente</span></li>
        </ul>
    </div>
    <form method="get" action="{% url 'communications:dashboard' %}" class="comm-mail-search ms-md-auto mt-1 mt-md-0">
        <input type="hidden" name="channel" value="email">
        {% if current_status %}<input type="hidden" name="status" value="{{ current_status }}">{% endif %}
        <select class="form-select form-select-sm py-0" name="search_scope" style="width: auto; max-width: 6.5rem; height: 28px;" disabled aria-disabled="true" title="Próximamente">
            <option>Todos</option>
        </select>
        <input type="search" name="q" value="{{ search_q|default:'' }}" class="form-control form-control-sm py-0" placeholder="Buscar…" style="width: 10rem; max-width: 26vw; height: 28px;">
        <button type="submit" class="btn btn-toolbar-mail" title="Buscar"><span class="comm-mail-tb-ico"><i class="fas fa-search"></i></span></button>
    </form>
</div>
