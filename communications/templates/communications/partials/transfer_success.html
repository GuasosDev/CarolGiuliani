{% load static %}
<div class="alert alert-success d-flex align-items-center justify-content-between shadow-sm" data-transfer-success="1" data-delay-ms="1000">
    
    <div class="d-flex align-items-center gap-2">
        <span>✅</span>
        <span>{{ message }}</span>
    </div>

    <button type="button" class="btn-close" aria-label="Close" onclick="this.parentElement.remove()"></button>

</div>

<script src="{% static 'communications/js/transfer_success.js' %}"></script>
