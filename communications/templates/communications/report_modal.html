<div class="modal-header border-0 pb-0">
    <h5 class="modal-title fw-bold" id="reportModalLabel">
        <i class="fas fa-file-pdf text-danger me-2"></i> Configurar Reporte PDF
    </h5>
    <button type="button" class="btn-close" onclick="closeModal()" aria-label="Close"></button>
</div>
<form method="post" action="{% url 'communications:conversation_report' %}" target="_blank">
    <div class="modal-body py-4">
        {% csrf_token %}
        <div class="mb-4">
            <label for="{{ form.client.id_for_label }}" class="form-label fw-bold text-muted small text-uppercase">
                {{ form.client.label }}
            </label>
            {{ form.client }}
            <div class="form-text">Seleccione el cliente para filtrar el historial.</div>
        </div>
        
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <label for="{{ form.start_date.id_for_label }}" class="form-label fw-bold text-muted small text-uppercase">
                    {{ form.start_date.label }}
                </label>
                {{ form.start_date }}
            </div>
            <div class="col-md-6">
                <label for="{{ form.end_date.id_for_label }}" class="form-label fw-bold text-muted small text-uppercase">
                    {{ form.end_date.label }}
                </label>
                {{ form.end_date }}
            </div>
        </div>

        <div class="alert alert-info border-0 shadow-none mb-0 d-flex align-items-center" style="background-color: rgba(79, 198, 225, 0.1);">
            <i class="fas fa-info-circle text-info fs-4 me-3"></i>
            <div class="small text-info">
                Se incluirán todos los mensajes de WhatsApp y Email enviados y recibidos en el periodo seleccionado.
            </div>
        </div>
    </div>
    <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-link text-muted text-decoration-none fw-bold" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary px-4 fw-bold" onclick="setTimeout(closeModal, 1500)">
            <i class="fas fa-download me-2"></i> Generar y Descargar
        </button>
    </div>
</form>

<style>
    .modal-content {
        border-radius: 15px;
        border: none;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .form-select, .form-control {
        border-radius: 8px;
        padding: 0.6rem 1rem;
        border: 1px solid #e2e8f0;
    }
    .form-select:focus, .form-control:focus {
        border-color: #6658dd;
        box-shadow: 0 0 0 3px rgba(102, 88, 221, 0.1);
    }
</style>
