<div class="modal-header">
    <h5 class="modal-title" id="reportModalLabel">Generar Reporte de Conversaciones</h5>
    <button type="button" class="btn-close" onclick="closeModal()" aria-label="Close"></button>
</div>
<form method="post" action="{% url 'communications:conversation_report' %}" target="_blank">
    <div class="modal-body">
        {% csrf_token %}
        <div class="mb-3">
            <label for="{{ form.client.id_for_label }}" class="form-label">{{ form.client.label }}</label>
            {{ form.client }}
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="{{ form.start_date.id_for_label }}" class="form-label">{{ form.start_date.label }}</label>
                {{ form.start_date }}
            </div>
            <div class="col-md-6 mb-3">
                <label for="{{ form.end_date.id_for_label }}" class="form-label">{{ form.end_date.label }}</label>
                {{ form.end_date }}
            </div>
        </div>
        <p class="text-muted small">
            <i class="fas fa-info-circle me-1"></i> Se generará un archivo PDF con el historial de conversaciones del cliente seleccionado en el rango de fechas indicado.
        </p>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-primary" onclick="setTimeout(closeModal, 1000)">
            <i class="fas fa-file-pdf me-2"></i> Generar PDF
        </button>
    </div>
</form>
