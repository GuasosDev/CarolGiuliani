<div class="comm-apple-modal comm-report-modal">
<div class="modal-header">
    <div class="comm-apple-heading">
        <p class="comm-apple-kicker">Reportes</p>
        <h3 class="modal-title">Configurar reporte PDF</h3>
    </div>
    <button type="button" class="btn-close" onclick="closeModal()" aria-label="Close"></button>
</div>

<form method="post" action="{% url 'communications:conversation_report' %}" target="_blank">
    {% csrf_token %}
    <div class="modal-body">
        <section class="comm-apple-section">
            <div class="mb-2">
                <label for="{{ form.client.id_for_label }}" class="form-label">{{ form.client.label }}</label>
                {{ form.client }}
                <div class="comm-apple-hint">Filtrá el historial por este cliente.</div>
            </div>
            <div class="row g-2">
                <div class="col-md-6">
                    <label for="{{ form.start_date.id_for_label }}" class="form-label">{{ form.start_date.label }}</label>
                    {{ form.start_date }}
                </div>
                <div class="col-md-6">
                    <label for="{{ form.end_date.id_for_label }}" class="form-label">{{ form.end_date.label }}</label>
                    {{ form.end_date }}
                </div>
            </div>
            <div class="comm-apple-info mt-2">
                Incluye mensajes de WhatsApp y Email del periodo seleccionado.
            </div>
        </section>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-sm comm-apple-btn-ghost" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-sm comm-apple-btn-primary" onclick="setTimeout(closeModal, 1500)">
            Generar y descargar
        </button>
    </div>
</form>
</div>
