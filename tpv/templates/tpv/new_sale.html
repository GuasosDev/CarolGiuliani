{% extends 'core/base.html' %}

{% block content %}
<div class="row h-100">
    <!-- Panel Izquierdo: Buscador y Lista de Productos -->
    <div class="col-md-7">
        <div class="card h-100">
            <div class="card-header">
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-search"></i></span>
                    <input type="text" id="searchInput" class="form-control form-control-lg"
                        placeholder="Buscar por código, nombre o barras... (F2)" autofocus autocomplete="off">
                </div>
            </div>
            <div class="card-body p-0" style="overflow-y: auto; height: 500px;">
                <div id="searchResults" class="list-group list-group-flush">
                    <!-- Resultados de búsqueda aquí -->
                    <div class="p-3 text-center text-muted">
                        Empiece a escribir para buscar productos...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Panel Derecho: Carrito y Totales -->
    <div class="col-md-5">
        <div class="card h-100">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Venta Actual</h5>
                <span class="badge bg-light text-dark" id="itemCount">0 items</span>
            </div>

            <div class="card-body p-0 d-flex flex-column" style="height: 500px;">
                <!-- Lista de items en carrito -->
                <div class="table-responsive flex-grow-1" style="overflow-y: auto;">
                    <table class="table table-striped table-hover mb-0">
                        <thead class="table-light sticky-top">
                            <tr>
                                <th>Desc</th>
                                <th style="width: 70px;">Cant</th>
                                <th class="text-end">Total</th>
                                <th style="width: 30px;"></th>
                            </tr>
                        </thead>
                        <tbody id="cartTableBody">
                            <!-- Items del carrito -->
                        </tbody>
                    </table>
                </div>

                <!-- Sección de totales y pago -->
                <div class="border-top p-3 bg-light">
                    <div class="d-flex justify-content-between mb-2">
                        <h5>Total:</h5>
                        <h3 class="text-primary" id="cartTotal">$0.00</h3>
                    </div>

                    <div class="mb-3">
                        <select id="clientSelect" class="form-select">
                            <option value="">-- Cliente Casual --</option>
                            {% for client in clients %}
                            <option value="{{ client.id }}">{{ client.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <select id="paymentMethod" class="form-select">
                            <option value="cash">Efectivo</option>
                            <option value="card">Tarjeta</option>
                            <option value="transfer">Transferencia</option>
                            <option value="other">Otro</option>
                        </select>
                    </div>

                    <div class="d-grid gap-2">
                        <button class="btn btn-success btn-lg" id="btnProcessSale" disabled onclick="processSale()">
                            <i class="fas fa-check-circle"></i> COBRAR (F10)
                        </button>
                        <button class="btn btn-danger" onclick="clearCart()">
                            <i class="fas fa-trash"></i> Cancelar Venta
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let cart = [];
    let searchTimeout = null;

    // Initial Load
    {% if initial_cart %}
    try {
        cart = JSON.parse('{{ initial_cart|escapejs }}');
    } catch (e) {
        console.error("Error parsing initial cart", e);
    }
    {% endif %}

    // Initial Render
    document.addEventListener('DOMContentLoaded', function () {
        if (cart.length > 0) {
            renderCart();
            {% if initial_client %}
            document.getElementById('clientSelect').value = "{{ initial_client }}";
            {% endif %}
            {% if initial_payment %}
            document.getElementById('paymentMethod').value = "{{ initial_payment }}";
            {% endif %}
        }
    });

    // --- Buscador ---
    document.getElementById('searchInput').addEventListener('input', function (e) {
        clearTimeout(searchTimeout);
        const query = e.target.value.trim();

        if (query.length < 2) {
            document.getElementById('searchResults').innerHTML = '<div class="p-3 text-center text-muted">Escriba al menos 2 caracteres...</div>';
            return;
        }

        searchTimeout = setTimeout(() => {
            fetch(`/tpv/api/search-article/?q=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(data => {
                    const resultsContainer = document.getElementById('searchResults');
                    resultsContainer.innerHTML = '';

                    if (data.length === 0) {
                        resultsContainer.innerHTML = '<div class="p-3 text-center text-muted">No se encontraron productos.</div>';
                        return;
                    }

                    data.forEach(article => {
                        const item = document.createElement('a');
                        item.href = '#';
                        item.className = 'list-group-item list-group-item-action d-flex justify-content-between align-items-center';
                        item.onclick = (e) => { e.preventDefault(); addToCartRequest(article.id); };

                        item.innerHTML = `
                            <div>
                                <h6 class="mb-0">${article.description}</h6>
                                <small class="text-muted">Cod: ${article.code}</small>
                            </div>
                            <div class="text-end">
                                <span class="badge bg-primary rounded-pill">$${article.price.toFixed(2)}</span>
                                <br><small class="text-${article.stock > 0 ? 'success' : 'danger'}">Stock: ${article.stock}</small>
                            </div>
                        `;
                        resultsContainer.appendChild(item);
                    });
                });
        }, 300);
    });

    // --- Carrito ---
    function addToCartRequest(articleId) {
        // Verificar si ya está en el carrito para sumar cantidad (opcional, por ahora backend maneja logica simple)
        // Pero el backend de add_to_cart valida stock. 
        // Mejor enviamos request.

        fetch('/tpv/api/add-to-cart/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify({
                article_id: articleId,
                quantity: 1
            })
        })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                } else {
                    addToCartLocal(data.item);
                    document.getElementById('searchInput').value = '';
                    document.getElementById('searchResults').innerHTML = '<div class="p-3 text-center text-muted">Producto agregado. Busque otro...</div>';
                    document.getElementById('searchInput').focus();
                }
            })
            .catch(err => console.error(err));
    }

    function addToCartLocal(item) {
        const existingItem = cart.find(i => i.id === item.id);
        if (existingItem) {
            existingItem.quantity += 1;
            existingItem.subtotal = existingItem.quantity * existingItem.price;
        } else {
            cart.push(item);
        }
        renderCart();
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        renderCart();
    }

    function clearCart() {
        if (confirm('¿Borrar toda la venta actual?')) {
            cart = [];
            renderCart();
        }
    }

    function renderCart() {
        const tbody = document.getElementById('cartTableBody');
        tbody.innerHTML = '';
        let total = 0;
        let count = 0;

        cart.forEach((item, index) => {
            total += item.subtotal;
            count += item.quantity;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.description}</td>
                <td><input type="number" class="form-control form-control-sm" value="${item.quantity}" min="1" onchange="updateQuantity(${index}, this.value)" style="width: 60px;"></td>
                <td class="text-end">$${item.subtotal.toFixed(2)}</td>
                <td><button class="btn btn-sm btn-outline-danger" onclick="removeFromCart(${index})"><i class="fas fa-times"></i></button></td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('cartTotal').innerText = '$' + total.toFixed(2);
        document.getElementById('itemCount').innerText = count + ' items';

        const btnProcess = document.getElementById('btnProcessSale');
        btnProcess.disabled = cart.length === 0;
    }

    function updateQuantity(index, newQty) {
        newQty = parseFloat(newQty);
        if (newQty < 0.1) newQty = 1;

        cart[index].quantity = newQty;
        cart[index].subtotal = cart[index].price * newQty;
        renderCart();
    }

    // --- Procesar Venta ---
    function processSale() {
        if (cart.length === 0) return;

        const btn = document.getElementById('btnProcessSale');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Procesando...';

        const payload = {
            items: cart,
            client_id: document.getElementById('clientSelect').value || null,
            payment_method: document.getElementById('paymentMethod').value
        };

        fetch('/tpv/api/process-sale/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token }}'
            },
            body: JSON.stringify(payload)
        })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert('Error: ' + data.error);
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-check-circle"></i> COBRAR (F10)';
                } else {
                    // Éxito
                    window.location.href = data.redirect_url;
                }
            })
            .catch(err => {
                console.error(err);
                alert('Error de conexión');
                btn.disabled = false;
            });
    }

    // --- Atajos de teclado ---
    document.addEventListener('keydown', function (e) {
        if (e.key === 'F2') {
            e.preventDefault();
            document.getElementById('searchInput').focus();
        }
        if (e.key === 'F10') {
            e.preventDefault();
            if (!document.getElementById('btnProcessSale').disabled) {
                processSale();
            }
        }
    });

</script>
{% endblock %}
