{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Legales - GuasosDev Soft{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f2f4f8;
            color: #6c757d;
            padding-top: 50px;
            padding-bottom: 50px;
        }

        .legal-container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0.75rem 1.5rem rgba(18, 38, 63, .03);
        }

        h1,
        h2,
        h3 {
            color: #343a40;
            font-weight: 700;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 2rem;
            text-align: center;
            color: #6658dd;
        }

        h2 {
            font-size: 1.5rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
        }

        p {
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.85rem;
            color: #adb5bd;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: #343a40;
            text-align: center;
            margin-bottom: 30px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo-text">GuasosDev Soft</div>
        <div class="legal-container">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            &copy; {% now "Y" %} GuasosDev Soft. Todos los derechos reservados.
        </div>
    </div>
</body>

</html>
