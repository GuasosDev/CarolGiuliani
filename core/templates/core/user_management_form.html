<style>
    .modal-body ul { list-style: none; padding-left: 0; margin-bottom: 0; }
    .modal-body ul li { margin-bottom: 5px; }
    .modal-body ul li label { font-weight: normal; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    .groups-selector-container select { height: auto !important; min-height: 100px; }
</style>

<div class="modal-header">
    <h3 class="modal-title">{{ title }}</h3>
    <span class="close" onclick="closeModal()">&times;</span>
</div>

<form hx-post="{{ action_url }}" hx-swap="outerHTML">
    {% csrf_token %}
    <div class="modal-body" style="min-width: 600px;">
        {% if form.non_field_errors %}
        <div class="alert alert-danger">{{ form.non_field_errors }}</div>
        {% endif %}

        <div class="row">
            {% for field in form %}
            <div class="col-md-6 mb-3">
                <div class="form-group">
                    <label class="form-label d-flex justify-content-between align-items-center">
                        <span>{{ field.label }}</span>
                        {% if field.name == 'work_area' %}
                        <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none" 
                                hx-get="{% url 'work_area_create' %}" 
                                hx-target="#modal-secondary-body"
                                onclick="openModalSecondary()"
                                title="Nueva Área Laboral">
                            <i class="fas fa-plus-circle"></i>
                        </button>
                        {% elif field.name == 'user_role' %}
                        <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none" 
                                hx-get="{% url 'user_role_create' %}" 
                                hx-target="#modal-secondary-body"
                                onclick="openModalSecondary()"
                                title="Nuevo Rol de Usuario">
                            <i class="fas fa-plus-circle"></i>
                        </button>
                        {% elif field.name == 'groups' %}
                        <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none" 
                                hx-get="{% url 'privilege_create' %}" 
                                hx-target="#modal-secondary-body"
                                onclick="openModalSecondary()"
                                title="Nuevo Grupo de Privilegios">
                            <i class="fas fa-plus-circle"></i>
                        </button>
                        {% endif %}
                    </label>
                    <div class="{% if field.name == 'groups' %}groups-selector-container{% endif %}">
                        {{ field }}
                    </div>
                    {% if field.help_text %}<small class="text-muted d-block">{{ field.help_text }}</small>{% endif %}
                    {% for error in field.errors %}
                    <div class="text-danger small mt-1">{{ error }}</div>
                    {% endfor %}
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-light" onclick="closeModal()">
            <i class="fas fa-times me-1"></i> Cancelar
        </button>
        <button type="submit" class="btn btn-primary">
            <i class="fas fa-save me-1"></i> Guardar
        </button>
    </div>
</form>

<script>
    // re-apply form-control class to django rendered inputs
    document.querySelectorAll('.modal-body input, .modal-body select, .modal-body textarea').forEach(el => {
        if (!el.classList.contains('form-check-input')) {
            el.classList.add('form-control');
        }
    });
</script>
