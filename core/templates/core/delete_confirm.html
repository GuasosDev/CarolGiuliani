<form class="comm-delete-confirm" hx-post="{{ request.path }}" hx-target="body">
    {% csrf_token %}
    <div class="modal-header">
        <h5 class="modal-title">Confirmar Eliminación</h5>
        <button type="button" class="btn-close comm-delete-close" onclick="closeModal()" aria-label="Cerrar"></button>
    </div>
    <div class="modal-body">
        <p>¿Estás seguro de que deseas eliminar este elemento: <strong>{{ object }}</strong>?</p>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
        <button type="submit" class="btn btn-danger">Eliminar</button>
    </div>
</form>
