<tr id="line-{{ line.pk }}">
    <td style="padding: 10px; border-bottom: 1px solid #eee;">{{ forloop.counter }}</td>
    <td style="padding: 10px; border-bottom: 1px solid #eee;">
        <input type="text" name="description" class="form-control" value="{{ line.description }}"
            form="form-{{ line.pk }}" required>
    </td>
    <td style="padding: 10px; border-bottom: 1px solid #eee;">
        <input type="text" name="serial_number" class="form-control" value="{{ line.serial_number|default:'' }}"
            form="form-{{ line.pk }}" placeholder="Serial">
    </td>
    <td style="padding: 10px; border-bottom: 1px solid #eee;">
        <input type="number" name="quantity" class="form-control" value="{{ line.quantity }}" form="form-{{ line.pk }}"
            style="text-align: right;" required>
    </td>
    <td style="padding: 10px; border-bottom: 1px solid #eee;">
        <input type="number" name="unit_cost" class="form-control" value="{{ line.unit_cost }}"
            form="form-{{ line.pk }}" step="0.01" style="text-align: right;" required>
    </td>
    <td style="padding: 10px; border-bottom: 1px solid #eee; text-align: right;">${{ line.subtotal }}</td>
    <td style="padding: 10px; border-bottom: 1px solid #eee; text-align: center;">
        <form id="form-{{ line.pk }}" hx-post="{% url 'invoice_line_update' line.pk %}" hx-target="#invoice-lines"
            hx-swap="innerHTML">
            {% csrf_token %}
            <button type="submit" class="btn btn-success btn-sm"><i class="fas fa-check"></i></button>
            <button type="button" class="btn btn-secondary btn-sm"
                hx-get="{% url 'invoice_line_update' line.pk %}?cancel=true" hx-target="#line-{{ line.pk }}"
                hx-swap="outerHTML"><i class="fas fa-times"></i></button>
        </form>
    </td>
</tr>
