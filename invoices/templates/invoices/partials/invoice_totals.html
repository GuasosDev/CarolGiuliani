<div id="invoice-totals" style="background-color: #f4f5f7; padding: 20px; border-radius: 4px;" hx-swap-oob="true">
    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
        <span>Sub - Total amount:</span>
        <span>${{ invoice.total }}</span>
    </div>
    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
        <span>Tax (18%):</span>
        <span>$0.00</span>
    </div>
    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
        <span>Shipping:</span>
        <span>$0.00</span>
    </div>
    <hr style="border-top: 1px solid #e2e7f1;">
    <div
        style="display: flex; justify-content: space-between; font-size: 20px; font-weight: 700; color: var(--heading-color); margin-top: 10px;">
        <span>Total:</span>
        <span>${{ invoice.total }}</span>
    </div>
</div>
